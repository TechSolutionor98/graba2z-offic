    <!-- The link preview for every page served from this shell: what WhatsApp,
         Facebook, LinkedIn, X and iMessage show for a pasted grabatoz.ae link.

         None of those crawlers run JavaScript. The app's <SEO> component writes
         far better per-page tags, but it writes them from React, long after the
         crawler has read the document and gone. All it ever sees is this file.

         So these are the floor, not the ceiling -- a correct card for any page
         with no better one -- and deliberately generic, because one file is
         served for every address.

         og:url is left out on purpose: it is the one tag that cannot be written
         truthfully here, and a wrong one is worse than none. Facebook treats it
         as canonical, so hardcoding the homepage would collapse every shared
         category, brand and blog link into one homepage card. Absent, each app
         uses the address that was actually pasted.

         data-rh="true" hands these to react-helmet-async, which only clears
         tags carrying its marker; unmarked, it would add its own beside these
         and leave the page with two of every tag. api/product-page.js replaces
         this whole block for product pages, matching the comment markers around
         it -- so keep them. -->
    <title data-rh="true">Grabatoz | Buy Laptops, Mobiles &amp; Electronics Online in UAE</title>

<!-- Internal-page guard.
     This shell is served for every path, admin routes included, so each
     marketing/analytics tag below has to opt out of the staff pages itself.
     Without it the admin URLs (and the record ids in them) are reported to
     GTM/GA4, staff sessions pollute the reports, and Clarity records replays
     of order and customer screens. -->
<script>
  window.dataLayer = window.dataLayer || []
  window.__grabatozInternalPage = (function () {
    try {
      return /^\/(admin|superadmin|grabiansadmin|grabiansuperadmin)(\/|$)/.test(
        (window.location.pathname || "").toLowerCase()
      )
    } catch (e) {
      return false
    }
  })()
</script>

<!-- Saved theme, applied before first paint.
     ThemeProvider caches the admin's palette as ready-made CSS text, so the
     first frame is already themed instead of flashing the shipped colours and
     then swapping. The runtime provider re-applies (and resolves any per-page
     rule) the moment React mounts, and its inline styles on <html> win over
     this block -- so a stale cache is corrected, never stuck.

     Skipped on staff pages: /admin keeps the shipped palette, always. -->
<script>
  (function () {
    try {
      if (window.__grabatozInternalPage) return
      var css = window.localStorage.getItem("grabatoz-theme-css-v1")
      if (!css) return
      var style = document.createElement("style")
      style.id = "grabatoz-theme-preload"
      style.textContent = ":root{" + css + "}"
      document.head.appendChild(style)
    } catch (e) {
      /* No storage, or a malformed cache: the stylesheet defaults stand. */
    }
  })()
</script>
